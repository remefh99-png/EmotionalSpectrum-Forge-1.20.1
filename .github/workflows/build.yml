name: Build Minecraft Forge mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Extract source files
        run: unzip -o src.zip -d .
      - name: Fix escaped newline in Java source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("src/main/java/com/remefh/emotionalspectrum/SpectrumLogic.java")
          s = p.read_text()
          s = re.sub(r'\\+n(?=    public static String displayName)', '\\n', s)
          p.write_text(s)
          logic = Path("src/main/java/com/remefh/emotionalspectrum/SpectrumLogic.java")
          s = logic.read_text().replace("import net.minecraft.world.phys.ClipContext;", "import net.minecraft.world.level.ClipContext;")
          logic.write_text(s)
          hud = Path("src/main/java/com/remefh/emotionalspectrum/SpectrumHud.java")
          s = hud.read_text().replace('event.registerAboveAll(new ResourceLocation(EmotionalSpectrum.MODID, "spectrum_hud"),', 'event.registerAboveAll("spectrum_hud",')
          hud.write_text(s)
          PY
      - name: Build mod
        run: gradle build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: emotional-spectrum-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
